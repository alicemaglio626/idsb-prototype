<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Datavant Portal</title>
    <script>
      // GitHub Pages has no server-side routing, so a hard refresh or direct
      // link to a sub-route (e.g. /orders/ORD-1001) 404s here. Encode the
      // requested path into a query param and redirect to the real
      // index.html, which restores it before the app boots (see the
      // matching script in index.html's <head>).
      (function () {
        var base = '/idsb-prototype/';
        var loc = window.location;
        // Keep the full original path (base included) so BrowserRouter's
        // basename still matches once index.html restores it.
        loc.replace(base + '?p=' + encodeURIComponent(loc.pathname) + '&h=' + encodeURIComponent(loc.hash));
      })();
    </script>
  </head>
  <body></body>
</html>
